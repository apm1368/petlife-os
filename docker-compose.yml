name: petlife-os

services:
  postgres:
    restart: unless-stopped
    # postgis/postgis ships the same postgres:16 base plus the PostGIS extension
    # (Handoff 19: Pet-Friendly Places geo search) — the extension itself is
    # still only enabled by running `CREATE EXTENSION IF NOT EXISTS postgis;`,
    # which the Handoff 19 migration does on first apply.
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: petlife
      # Only applied when the data volume is first initialised; on an existing volume rotate with ALTER USER.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petlife}
      POSTGRES_DB: petlife_os
    # Loopback only: Docker's published ports bypass ufw, so a bare "5432:5432" is open to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - petlife_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petlife"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-petlife}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    restart: unless-stopped
    # Pinned to the release the canonical server already runs; bump deliberately, never via :latest.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-petlife}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-petlife123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - petlife_minio:/data

volumes:
  petlife_postgres:
  petlife_minio:
