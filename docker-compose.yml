name: petlife-os

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petlife
      POSTGRES_PASSWORD: petlife
      POSTGRES_DB: petlife_os
    ports:
      - "5432:5432"
    volumes:
      - petlife_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petlife"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: petlife
      MINIO_ROOT_PASSWORD: petlife123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - petlife_minio:/data

volumes:
  petlife_postgres:
  petlife_minio:
