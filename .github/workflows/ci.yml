name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://petlife:petlife@localhost:5432/petlife_os_test?schema=public
  REDIS_URL: redis://localhost:6379
  WEB_APP_ORIGIN: http://localhost:3000
  SESSION_SECRET: ci-session-secret-not-for-prod-0000000
  CSRF_SECRET: ci-csrf-secret-not-for-prod-00000000000
  NEXT_PUBLIC_API_ORIGIN: http://localhost:4000

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petlife
          POSTGRES_PASSWORD: petlife
          POSTGRES_DB: petlife_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petlife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages (types, config)
        run: |
          pnpm --filter @petlife/types build
          pnpm --filter @petlife/config build

      - name: Generate Prisma client
        run: pnpm --filter @petlife/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm --filter @petlife/api exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: API e2e tests
        run: pnpm --filter @petlife/api test:e2e

      - name: Build
        run: pnpm build
