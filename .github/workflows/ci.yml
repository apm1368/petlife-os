name: CI

# main runs CI through deploy.yml (workflow_call) before deploying; a separate push trigger here would run it twice.
on:
  workflow_call:
  push:
    branches: [stabilization/wave-1]
  pull_request:

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://petlife:petlife@localhost:5432/petlife_os_test?schema=public
  REDIS_URL: redis://localhost:6379
  WEB_APP_ORIGIN: http://localhost:3000
  SESSION_SECRET: ci-session-secret-not-for-prod-0000000
  CSRF_SECRET: ci-csrf-secret-not-for-prod-00000000000
  NEXT_PUBLIC_API_ORIGIN: http://localhost:4000

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # postgis/postgis ships the same postgres:16 base plus the PostGIS
        # extension (Handoff 19: Pet-Friendly Places geo search) — matches
        # docker-compose.yml exactly. A plain postgres:16-alpine image here
        # would fail CI's own "Run database migrations" step below on the
        # Handoff 19 migration's `CREATE EXTENSION IF NOT EXISTS postgis`.
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: petlife
          POSTGRES_PASSWORD: petlife
          POSTGRES_DB: petlife_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petlife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The deploy workflow is production-only. Keep its observable release metadata and
      # post-deploy smoke contract from drifting back to a staging-labelled release (TC-04).
      - name: Verify production deploy contract
        run: bash scripts/ops/verify-production-deploy-contract.sh

      - name: Build shared packages (types, config)
        run: |
          pnpm --filter @petlife/types build
          pnpm --filter @petlife/config build

      - name: Generate Prisma client
        run: pnpm --filter @petlife/api db:generate

      - name: Decision-code parity (Persian Decision Log vs English translation)
        run: node scripts/verify-decision-code-parity.mjs

      - name: Lint
        run: pnpm lint

      - name: Design-system contract and visual stories
        run: |
          pnpm --filter @petlife/ui test
          pnpm --filter @petlife/ui storybook:build
          pnpm --filter @petlife/ui exec playwright install --with-deps chromium
          pnpm --filter @petlife/ui test:visual

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm --filter @petlife/api exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: API e2e tests
        # Each run receives a newly-created, migrated *_test database and it
        # is removed afterwards. Running in-band prevents financial scenarios
        # from sharing mutable inventory/payment state across Jest workers.
        run: pnpm --filter @petlife/api test:e2e:fresh -- --runInBand

      - name: Build
        run: pnpm build
