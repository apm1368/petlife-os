name: Deploy to VPS

# Deploys only from main (feature branch → PR → CI → main → deploy). A manual run is accepted only for main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy in flight: a cancelled run can stop between migrate and build and leave the server
# half-deployed. A newer push waits for the running deploy instead.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Build the release on GitHub, not on the 3.9 GB VPS: there a full build took 40–60 min under memory pressure and a
  # half-written .next once took the site's JavaScript down (2026-11-12). The build runs at the same absolute path
  # as production so nothing path-dependent differs, with the production API origin the server build used.
  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP: /var/www/petlife-os
      NEXT_PUBLIC_API_ORIGIN: https://opetlife.ir/api
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Place the source where production builds it
        run: |
          sudo mkdir -p "$APP" && sudo chown "$USER" "$APP"
          cp -a "$GITHUB_WORKSPACE/." "$APP/"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        working-directory: /var/www/petlife-os
        run: pnpm install --frozen-lockfile
      - name: Build api and web
        working-directory: /var/www/petlife-os
        run: |
          pnpm --filter @petlife/api db:generate
          pnpm turbo run build --filter=@petlife/api --filter=@petlife/web --concurrency=2
          test -f apps/api/dist/main.js && test -f apps/web/.next/BUILD_ID
      - name: Pack the release
        working-directory: /var/www/petlife-os
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          echo '${{ github.sha }}' > RELEASE_SHA
          tar --exclude=apps/web/.next/cache -czf "$RUNNER_TEMP/release/release-${{ github.sha }}.tgz" \
            RELEASE_SHA apps/web/.next apps/api/dist packages/types/dist packages/config/dist
          cd "$RUNNER_TEMP/release" && sha256sum "release-${{ github.sha }}.tgz" > "release-${{ github.sha }}.tgz.sha256"
          ls -la "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: [ci, release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release
      # CI pushes the build to the box over the same SSH key; the box never has to download it from GitHub.
      - name: Upload the release to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: release/release-${{ github.sha }}.tgz,release/release-${{ github.sha }}.tgz.sha256
          target: /var/www/petlife-os-releases/incoming
          strip_components: 1
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          # With the CI-built release the server step takes minutes; the long limit stays for the local-build
          # fallback, so a slow build never ends the job while deploy.sh is still running (see the lock wait below).
          command_timeout: 90m
          script: |
            cd /var/www/petlife-os
            # Never touch the working tree while another deploy.sh still builds in it: a job that hit its SSH timeout
            # leaves deploy.sh running on the server, and resetting the checkout under it broke that build and this
            # one (2026-11-12). Wait for deploy.sh's own lock to be free (up to 60 min) before fetching.
            for i in $(seq 1 360); do flock -n /var/lock/petlife-deploy.lock -c true && break; echo "deploy: waiting for the running deploy to finish ($i)"; sleep 10; done
            flock -n /var/lock/petlife-deploy.lock -c true || { echo "deploy: another deploy still holds the lock after 60 min" >&2; exit 1; }
            # Some VPS networks block outbound SSH on port 22. GitHub's SSH
            # endpoint on 443 keeps deploy-key authentication deterministic.
            git remote set-url origin ssh://git@ssh.github.com:443/apm1368/petlife-os.git
            export GIT_SSH_COMMAND="ssh -p 443 -i /root/.ssh/petlife_github_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            git fetch --prune origin
            # -f: the next line hard-resets anyway; without it a local edit (e.g. a hot-applied docker-compose.yml
            # identical to the one in main) makes checkout abort and the deploy never starts.
            git checkout -f -B main origin/main
            git reset --hard "${{ github.sha }}"
            export BUILD_SHA='${{ github.sha }}'
            export BUILD_TIME='${{ github.event.head_commit.timestamp }}'
            # This workflow deploys the canonical `main` branch to the public VPS behind
            # opetlife.ir. Labeling that process as staging made /health/version and the
            # backoffice release trace disagree with the actual destination (TC-04).
            export DEPLOYMENT_ENVIRONMENT='production'
            export DEPLOYMENT_ID='github-${{ github.run_id }}-${{ github.run_attempt }}'
            # The CI-built release uploaded above; deploy.sh verifies its checksum and sha and swaps it in.
            export PREBUILT_ARCHIVE='/var/www/petlife-os-releases/incoming/release-${{ github.sha }}.tgz'
            /var/www/petlife-os/deploy.sh
            export EXPECTED_BUILD_SHA='${{ github.sha }}'
            export EXPECTED_DEPLOYMENT_ENVIRONMENT='production'
            bash scripts/smoke-production.sh
      # Checking a single common chunk missed stale /de/legal HTML. Inspect every
      # owned CSS/JS reference on the scoped public routes, from outside the VPS.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify public HTML and build assets
        timeout-minutes: 5
        run: python3 docs/qa/tools/public-assets-smoke.py --expected-sha '${{ github.sha }}' --output-dir .qa-public-assets
      - name: Retain public asset verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-assets-${{ github.sha }}
          path: .qa-public-assets/results.json
          if-no-files-found: ignore
          retention-days: 7
