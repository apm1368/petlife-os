name: Deploy to VPS

on:
  push:
    branches: [ main, master, integration/local ]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /var/www/petlife-os
            git fetch --prune origin
            git checkout --force "${{ github.ref_name }}"
            git reset --hard "${{ github.sha }}"
            chmod +x /var/www/petlife-os/deploy.sh
            /var/www/petlife-os/deploy.sh
