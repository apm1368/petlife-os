packages:
  - "apps/*"
  - "packages/*"

overrides:
  "proxy-addr@<2.0.8": "2.0.8"
  "body-parser@>=1 <1.20.9": "1.20.9"
  "qs@>=6 <6.16.1": "6.16.1"
  "multer@>=2 <2.5.0": "2.5.0"
  "postcss@>=8 <8.5.23": "8.5.26"
  "source-map-js@>=1 <1.2.2": "1.2.2"
  "lodash@>=4 <4.18.0": "4.18.1"
  "brace-expansion@>=5 <5.0.12": "5.0.12"
  # Nest's FileTypeValidator dynamically imports this parser; keep it on the patched v21 line.
  "file-type@<21.3.2": "21.3.2"
  # Keep the TypeScript/ESLint tooling glob parser above GHSA-g3hv-75wg-m249's vulnerable range.
  "minimatch@>=7 <11.0.1": "11.0.1"

# pnpm 10 reads install policy from the workspace manifest, not package.json.
# Keeping this here makes local, headless, and GitHub Actions installs agree.
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
  - "unrs-resolver"
  - "sharp"
  - "argon2"

# CI and agent shells are intentionally non-interactive; a stale virtual
# store must be repairable without waiting for a TTY confirmation.
confirmModulesPurge: false

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
