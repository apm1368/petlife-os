<!-- @dsCard group="Media" height=460 subtitle="قاب ریلز با صحنهٔ ساخته‌شدن لوگو" -->
<div dir="rtl" class="demo">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400..900&display=swap">
  <style>
    .demo{font-family:var(--font-fa);background:var(--cream);padding:24px;display:flex;gap:32px;align-items:center;justify-content:center;flex-wrap:wrap}
    .reel{position:relative;width:230px;aspect-ratio:9/16;border-radius:30px;overflow:hidden;background:#FDF4E6;box-shadow:0 0 0 8px var(--raised),0 0 0 9px var(--line),0 30px 60px -30px rgba(46,40,28,.6)}
    .reel svg.scene{position:absolute;inset:0;width:100%;height:100%}
    .bars{position:absolute;inset:10px 12px auto;display:flex;gap:3px}
    .bars i{flex:1;height:3px;border-radius:3px;background:rgba(0,0,0,.16)}
    .bars i.on{background:var(--sun)}
    .kick{position:absolute;top:22px;right:12px;background:var(--sun);color:var(--on-sun);font-size:11px;font-weight:800;padding:3px 10px;border-radius:var(--radius-pill)}
    .sub{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);width:max-content;max-width:88%;background:rgba(20,30,24,.8);color:#fff;font-size:12.5px;font-weight:800;line-height:1.7;padding:6px 12px;border-radius:14px;text-align:center}
    .ctl{position:absolute;inset:auto 12px 12px;display:flex;align-items:center;gap:6px}
    .ctl span{margin-inline-end:auto;font-size:10.5px;font-weight:700;color:#fff;background:rgba(20,30,24,.55);padding:3px 9px;border-radius:999px}
    .ctl b{width:28px;height:28px;border-radius:50%;background:rgba(20,30,24,.55)}
    ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:340px}
    li{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:var(--radius-pill);background:var(--raised);font-size:13.5px;font-weight:700;color:var(--ink-2)}
    li b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-size:12px}
    li.on{background:var(--forest);color:var(--on-forest)}li.on b{background:var(--sun);color:var(--on-sun)}
  </style>
  <div class="reel">
    <svg class="scene" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="70" cy="110" r="70" fill="#FBE7C6"/><circle cx="310" cy="500" r="90" fill="#FBE7C6"/><g transform="translate(60 132) scale(1.2)" fill="#1F5A3D"><path d="M19.9 51.8 L16 27 L39.6 36.6 Z" stroke="#1F5A3D" stroke-width="5" stroke-linejoin="round"/><path d="M76.1 51.8 L80 27 L56.4 36.6 Z" stroke="#1F5A3D" stroke-width="5" stroke-linejoin="round"/><circle cx="48" cy="68" r="26" fill="none" stroke="#1F5A3D" stroke-width="13"/><ellipse cx="40.5" cy="65" rx="3" ry="3.6"/><ellipse cx="55.5" cy="65" rx="3" ry="3.6"/><path d="M45 72 h6 l-3 3.6 z" fill="#F2B544"/><rect x="92" y="36" width="13" height="84" rx="6.5"/><circle cx="122" cy="68" r="26" fill="none" stroke="#1F5A3D" stroke-width="13"/><ellipse cx="157" cy="66" rx="6" ry="5" fill="#1E241F"/><circle cx="130" cy="62" r="3.4"/><path d="M109 38 C100 34 91 43 95 60 C98 72 106 77 110 70 C113 63 112 51 117 42 Z" fill="#F2B544"/><rect x="170" y="22" width="13" height="78.5" rx="6.5"/><path d="M176.5 26 C176 12 186 3 198 3 C198 16 190 25 176.5 26 Z" fill="#7DB46C"/></g><text x="180" y="350" direction="rtl" text-anchor="middle" font-family="Vazirmatn" font-size="46" font-weight="900" fill="#1F5A3D">اپت لایف</text><text x="180" y="388" direction="rtl" text-anchor="middle" font-family="Vazirmatn" font-size="16" font-weight="600" fill="#4F574F">یک جهان برای حیوانات خانگی</text></svg>
    <div class="bars"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <span class="kick">اپت لایف</span>
    <p class="sub">یک جهان برای سگ، گربه، پرنده و همهٔ همراه‌ها.</p>
    <div class="ctl"><span>موسیقی بی‌کلام</span><b></b><b></b></div>
  </div>
  <ol><li class="on"><b>۱</b>اپت لایف</li><li><b>۲</b>پروندهٔ سلامت</li><li><b>۳</b>تقویم مراقبت</li><li><b>۴</b>دامپزشکی</li><li><b>۵</b>پت‌شاپ</li><li><b>۶</b>آرایش و اقامت</li><li><b>۷</b>سفر</li><li><b>۸</b>آرامش خاطر</li><li><b>۹</b>جامعه و حمایت</li><li><b>۱۰</b>پایان</li></ol>
</div>
<script>/* static preview */</script>
