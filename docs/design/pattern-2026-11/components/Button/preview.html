<!-- @dsCard group="Actions" height=170 subtitle="چهار گونهٔ نرم و کپسولی" -->
<div dir="rtl" class="demo">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400..900&display=swap">
  <style>
    .demo{font-family:var(--font-fa);background:var(--paper);padding:22px;display:grid;gap:16px}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .btn{--bg:var(--raised);--fg:var(--ink);display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border:0;border-radius:var(--radius-pill);background:var(--bg);color:var(--fg);font:inherit;font-weight:750;font-size:16px;cursor:pointer;box-shadow:var(--shadow-button);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
    .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-button-hover)}
    .btn:active{transform:scale(.97)}
    .btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
    .primary{--bg:var(--forest);--fg:var(--on-forest)}
    .sun{--bg:var(--sun);--fg:var(--on-sun)}
    .soft{--bg:var(--mint);--fg:var(--forest)}
    .line{--bg:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
    .line:hover{box-shadow:inset 0 0 0 1.5px var(--forest)}
    .sm{min-height:40px;padding:0 18px;font-size:14.5px}
    .lg{min-height:60px;padding:0 34px;font-size:17px}
    .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <div class="row">
    <button class="btn primary" type="button">ساخت حساب<svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></button>
    <button class="btn sun" type="button">دیدن آگهی‌های گمشده</button>
    <button class="btn soft" type="button">ورود</button>
    <button class="btn line" type="button">ورود همکار</button>
  </div>
  <div class="row">
    <button class="btn primary sm" type="button">عضویت</button>
    <button class="btn soft sm" type="button">ورود</button>
    <button class="btn primary lg" type="button">ساخت حساب<svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></button>
  </div>
</div>
<script>/* static preview */</script>
