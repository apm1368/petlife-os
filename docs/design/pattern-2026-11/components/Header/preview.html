<!-- @dsCard group="Navigation" height=120 width=1200 subtitle="هدر شیشه‌ای مشترک" -->
<div dir="rtl" class="demo">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400..900&display=swap">
  <style>
    .demo{font-family:var(--font-fa);background:linear-gradient(180deg,#fbe8cf,#f4d9b5);padding:0 0 30px}
    .hdr{display:flex;align-items:center;gap:16px;min-height:74px;padding:0 32px;background:rgba(255,251,245,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
    .brand svg{width:58px;height:auto;color:var(--forest)}
    .brand b{display:block;font-size:20px;font-weight:900;color:var(--forest);line-height:1.2}
    .brand small{display:block;font-size:11px;color:var(--ink-3)}
    nav{display:flex;gap:2px;margin-inline:auto}
    nav a{min-height:42px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:var(--radius-pill);color:var(--ink-2);font-weight:700;font-size:15px;text-decoration:none}
    nav a.on,nav a:hover{background:var(--mint);color:var(--forest)}
    .act{display:flex;gap:8px;align-items:center}
    .ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;font-size:13px;color:var(--ink-2)}
    .btn{display:inline-flex;align-items:center;min-height:40px;padding:0 18px;border-radius:var(--radius-pill);font-weight:750;font-size:14.5px;text-decoration:none;box-shadow:var(--shadow-button)}
    .primary{background:var(--forest);color:var(--on-forest)}.soft{background:var(--mint);color:var(--forest)}.line{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
  </style>
  <header class="hdr">
    <a class="brand" href="#"><svg viewBox="0 0 200 124" aria-hidden="true"><path d="M19.9 51.8 L16 27 L39.6 36.6 Z" fill="currentColor" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><path d="M76.1 51.8 L80 27 L56.4 36.6 Z" fill="currentColor" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><circle cx="48" cy="68" r="26" fill="none" stroke="currentColor" stroke-width="13"/><ellipse cx="40.5" cy="65" rx="3" ry="3.6" fill="currentColor"/><ellipse cx="55.5" cy="65" rx="3" ry="3.6" fill="currentColor"/><path d="M45 72 h6 l-3 3.6 z" fill="#F2B544"/><rect x="92" y="36" width="13" height="84" rx="6.5" fill="currentColor"/><circle cx="122" cy="68" r="26" fill="none" stroke="currentColor" stroke-width="13"/><ellipse cx="157" cy="66" rx="6" ry="5" fill="#1E241F"/><circle cx="130" cy="62" r="3.4" fill="currentColor"/><path d="M109 38 C100 34 91 43 95 60 C98 72 106 77 110 70 C113 63 112 51 117 42 Z" fill="#F2B544"/><rect x="170" y="22" width="13" height="78.5" rx="6.5" fill="currentColor"/><path d="M176.5 26 C176 12 186 3 198 3 C198 16 190 25 176.5 26 Z" fill="#7DB46C"/></svg><span><b>اپت لایف</b><small>یک جهان برای حیوانات خانگی</small></span></a>
    <nav aria-label="ناوبری اصلی"><a class="on" href="#">خانه</a><a href="#">خدمات ▾</a><a href="#">دامپزشکی</a><a href="#">دربارهٔ ما</a><a href="#">برای همکاران</a></nav>
    <div class="act"><span class="ib">فا</span><span class="ib">Aa</span><a class="btn line" href="#">همکاران</a><a class="btn soft" href="#">ورود</a><a class="btn primary" href="#">عضویت</a></div>
  </header>
</div>
