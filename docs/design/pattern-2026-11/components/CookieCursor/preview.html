<!-- @dsCard group="Motion" height=230 subtitle="ایستاده، راه رفتن، نشسته و رو به کاربر، تعظیم بازی" -->
<div dir="rtl" class="demo">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400..900&display=swap">
  <style>
    .demo{font-family:var(--font-fa);background:var(--paper);padding:18px;display:flex;flex-wrap:wrap;justify-content:space-around;gap:16px}
    figure{margin:0;display:grid;justify-items:center;gap:6px}
    figcaption{font-size:13px;font-weight:700;color:var(--ink-3)}
    .dog{width:150px;height:120px;overflow:visible}
    .dog *{transform-box:view-box}
    .d-flip{transform-origin:60px 50px}
    .pose-stand{transform-origin:40px 86px}
    .pose-sit{opacity:0}
    .dog.sit .pose-sit{opacity:1}.dog.sit .pose-stand{opacity:0}
    .dog.walk .pose-stand{animation:dbob .17s ease-in-out infinite alternate}
    @keyframes dbob{to{transform:translateY(-1.8px)}}
    .dog.bow .pose-stand{transform:rotate(15deg)}
    .dog.walk .d-a{animation:dleg .34s ease-in-out infinite alternate}
    .dog.walk .d-b{animation:dleg .34s ease-in-out infinite alternate-reverse}
    @keyframes dleg{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
    .d-tail,.d-tail2{animation:dwag .34s ease-in-out infinite alternate}
    .dog.bow .d-tail{animation-duration:.17s}
    @keyframes dwag{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
    .d-eyes,.d-eyes2{animation:dblink 4.4s infinite}
    @keyframes dblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
    .d-tongue{opacity:0}.dog.bow .d-tongue,.dog.look .d-tongue{opacity:1}
    .dog.look .d-head2{animation:dtilt 2.6s ease-in-out infinite}
    @keyframes dtilt{0%,100%{transform:rotate(0)}30%,64%{transform:rotate(-13deg)}}
    @media (prefers-reduced-motion:reduce){.demo *{animation:none!important}}
  </style>

"2.8" fill="#2B1D16"/><g class="d-eyes2" style="transform-origin:60px 31px"><circle cx="53" cy="31" r="3.2" fill="#2B1D16"/><circle cx="67" cy="31" r="3.2" fill="#2B1D16"/><circle cx="54.1" cy="29.9" r="1.1" fill="#fff"/><circle cx="68.1" cy="29.9" r="1.1" fill="#fff"/></g><path d="M55 19 q5 -5 10 0" stroke="#F7DDB0" stroke-width="2.2" fill="none" stroke-linecap="round"/></g></g></g></svg></template>
  <figure data-cls="stand"><figcaption>ایستاده</figcaption></figure>
  <figure data-cls="walk"><figcaption>راه رفتن</figcaption></figure>
  <figure data-cls="sit look"><figcaption>نشسته، رو به کاربر</figcaption></figure>
  <figure data-cls="bow"><figcaption>تعظیم بازی</figcaption></figure>
</div>
<script>
document.querySelectorAll('[data-cls]').forEach(function(f){var s=document.getElementById('dogTpl').content.firstElementChild.cloneNode(true);s.setAttribute('class','dog '+f.dataset.cls);f.insertBefore(s,f.firstChild);});
</script>
