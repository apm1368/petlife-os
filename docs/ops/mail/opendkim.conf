# /etc/opendkim.conf — opetlife.ir DKIM signing (2048-bit RSA) and verification
Syslog                  yes
SyslogSuccess           yes
UMask                   007
UserID                  opendkim
PidFile                 /run/opendkim/opendkim.pid
Socket                  inet:8891@127.0.0.1
Mode                    sv
Canonicalization        relaxed/simple
SubDomains              no
SignHeaders             From,Reply-To,Subject,Date,To,Cc,Message-ID,In-Reply-To,References,MIME-Version,Content-Type,Content-Transfer-Encoding,List-Id,List-Unsubscribe,List-Unsubscribe-Post
OversignHeaders         From,Subject,Date,To,Message-ID
SignatureAlgorithm      rsa-sha256
KeyTable                /etc/opendkim/key.table
SigningTable            refile:/etc/opendkim/signing.table
InternalHosts           /etc/opendkim/trusted.hosts
ExternalIgnoreList      /etc/opendkim/trusted.hosts
MTA                     ORIGINATING
TrustAnchorFile         /usr/share/dns/root.key
AuthservID              mail.opetlife.ir
