# /etc/nginx/sites-available/opetlife-mail — webmail + mail metadata hosts only.
# Separate from petlife-os (the live site); never edit that file from here.
server {
    listen 80;
    listen [::]:80;
    server_name webmail.opetlife.ir mail.opetlife.ir mta-sts.opetlife.ir autoconfig.opetlife.ir autodiscover.opetlife.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.opetlife.ir;
    ssl_certificate /etc/letsencrypt/live/mail.opetlife.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.opetlife.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://webmail.opetlife.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webmail.opetlife.ir;
    ssl_certificate /etc/letsencrypt/live/mail.opetlife.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.opetlife.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/roundcube/public_html;
    index index.php;
    client_max_body_size 30m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    # Roundcube's public_html only exposes index.php and static assets; deny dotfiles anyway.
    location ~ /\. {
        deny all;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;   # has try_files $fastcgi_script_name =404
        fastcgi_pass unix:/run/php/roundcube.sock;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mta-sts.opetlife.ir;
    ssl_certificate /etc/letsencrypt/live/mail.opetlife.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.opetlife.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /.well-known/mta-sts.txt {
        alias /var/www/opetlife-mail-meta/mta-sts.txt;
        default_type text/plain;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autoconfig.opetlife.ir autodiscover.opetlife.ir;
    ssl_certificate /etc/letsencrypt/live/mail.opetlife.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.opetlife.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Thunderbird / many Android clients
    location = /mail/config-v1.1.xml {
        alias /var/www/opetlife-mail-meta/config-v1.1.xml;
        default_type application/xml;
    }
    location = /.well-known/autoconfig/mail/config-v1.1.xml {
        alias /var/www/opetlife-mail-meta/config-v1.1.xml;
        default_type application/xml;
    }
    # Outlook (POST); answer any method with the static settings.
    location ~* ^/autodiscover/autodiscover\.xml$ {
        default_type application/xml;
        alias /var/www/opetlife-mail-meta/autodiscover.xml;
        error_page 405 =200 $uri;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
