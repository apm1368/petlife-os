; /etc/php/8.3/fpm/pool.d/roundcube.conf — the only PHP pool on this box (webmail).
[roundcube]
user = roundcube
group = roundcube
listen = /run/php/roundcube.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 300
request_terminate_timeout = 120s
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 30M
php_admin_value[max_execution_time] = 120
php_admin_value[error_log] = /var/log/roundcube/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[session.save_path] = /var/lib/roundcube/sessions
php_admin_value[open_basedir] = /var/www/roundcube:/var/lib/roundcube:/var/log/roundcube:/tmp:/usr/share/zoneinfo
php_admin_value[upload_tmp_dir] = /var/lib/roundcube/temp
php_admin_value[sys_temp_dir] = /var/lib/roundcube/temp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[expose_php] = 0
