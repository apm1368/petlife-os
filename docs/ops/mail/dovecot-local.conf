# /etc/dovecot/local.conf — opetlife.ir mail (virtual users, Maildir). Loaded last by dovecot.conf.
hostname = mail.opetlife.ir
protocols = imap lmtp sieve
listen = *
mail_location = maildir:~/Maildir
first_valid_uid = 5000
last_valid_uid = 5000
mail_plugins = $mail_plugins quota

ssl = required
ssl_cert = </etc/letsencrypt/live/mail.opetlife.ir/fullchain.pem
ssl_key = </etc/letsencrypt/live/mail.opetlife.ir/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_failure_delay = 3 secs
auth_cache_size = 1M
auth_cache_ttl = 10 mins
auth_cache_negative_ttl = 0

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%Lu /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = username_format=%Lu /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/var/vmail/%Ld/%Ln
}

service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 0
}
service pop3-login {
  inet_listener pop3 {
    port = 0
  }
  inet_listener pop3s {
    port = 0
  }
}
service managesieve-login {
  inet_listener sieve {
    address = 127.0.0.1
    port = 4190
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service imap {
  vsz_limit = 256M
}

namespace inbox {
  inbox = yes
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@opetlife.ir
}
protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 20
}
lmtp_rcpt_check_quota = yes
recipient_delimiter = +

plugin {
  quota = maildir:User quota
  quota_rule = *:storage=2G
  quota_grace = 10%%
  quota_status_success = DUNNO
  sieve = file:~/sieve;active=~/.dovecot.sieve
}
