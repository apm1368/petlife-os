# /etc/nginx/sites-available/petlife-os — the reverse proxy on the VPS (not deployed by CI; apply by hand:
#   cp /etc/nginx/sites-available/petlife-os /root/petlife-backups/nginx-petlife-os.<date> && edit && nginx -t && systemctl reload nginx).
# Uploads go browser → PUT /api/uploads/<token> (local storage driver). nginx's default 1 MB body limit refused
# ordinary phone photos and PDFs with 413 before the API saw them; only this path is raised, to the API's own
# ceiling (UPLOAD_CEILING_BYTES, 50 MB — each token is further capped at the size declared for it).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /api/uploads/ {
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
