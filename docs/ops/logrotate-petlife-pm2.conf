# opetlife: PM2 logs (petlife-api / petlife-web). copytruncate keeps the running processes writing to the same file.
/root/.pm2/logs/*.log {
    daily
    maxsize 50M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d-%s
}
#
# Install (as root, once; the server's own daily logrotate timer then runs it):
#   install -m 0644 docs/ops/logrotate-petlife-pm2.conf /etc/logrotate.d/petlife-pm2
#   logrotate -d /etc/logrotate.d/petlife-pm2      # dry run; should list petlife-api-error.log as "needs rotating"
# Why: /root/.pm2/logs/petlife-api-error.log had grown to 104 MB with no rotation (QA, 2026-11-12), on a disk at ~85%.
